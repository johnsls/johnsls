<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 60" width="620" height="60" font-family="'Fira Code', 'Cascadia Code', ui-monospace, monospace">
  <defs>
    <!-- Gradiente animado com a mesma paleta do banner -->
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
      <stop offset="0"   stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1"   stop-color="#3b82f6"/>
      <animate attributeName="x1" values="-320;520" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200;1040" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow suave, como no banner -->
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Máscaras de digitação (uma por frase) -->
    <clipPath id="clip0"><rect x="106" y="8" height="44" width="0">
      <animate attributeName="width" values="0;394.4;394.4;0;0" keyTimes="0;0.0889;0.1667;0.2222;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip1"><rect x="106" y="8" height="44" width="0">
      <animate attributeName="width" values="0;0;380.8;380.8;0;0" keyTimes="0;0.25;0.3389;0.4167;0.4722;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="106" y="8" height="44" width="0">
      <animate attributeName="width" values="0;0;380.8;380.8;0;0" keyTimes="0;0.5;0.5889;0.6667;0.7222;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="clip3"><rect x="106" y="8" height="44" width="0">
      <animate attributeName="width" values="0;0;353.6;353.6;0;0" keyTimes="0;0.75;0.8389;0.9167;0.9722;1" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath>

    <style>
      .line   { font-size: 22px; font-weight: 600; fill: url(#textGrad); }
      .caret  { fill: #a855f7; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    </style>
  </defs>

  <!-- Prompt fixo estilo terminal -->
  <text x="84" y="38" font-size="22" font-weight="600" fill="#6366f1" filter="url(#glow)">&#8250;</text>

  <!-- Frase 1 -->
  <text class="line" x="110" y="38" clip-path="url(#clip0)" filter="url(#glow)">Desenvolvedor Back-End Python</text>
  <rect class="caret" y="15" width="2.5" height="26" rx="1" filter="url(#glow)">
    <animate attributeName="x" values="114;508.4;508.4;114;114" keyTimes="0;0.0889;0.1667;0.2222;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="visibility" values="visible;hidden;hidden" keyTimes="0;0.2222;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- Frase 2 -->
  <text class="line" x="110" y="38" clip-path="url(#clip1)" filter="url(#glow)">APIs REST | Django | FastAPI</text>
  <rect class="caret" y="15" width="2.5" height="26" rx="1" filter="url(#glow)">
    <animate attributeName="x" values="114;114;494.8;494.8;114;114" keyTimes="0;0.25;0.3389;0.4167;0.4722;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;0.25;0.4722;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- Frase 3 -->
  <text class="line" x="110" y="38" clip-path="url(#clip2)" filter="url(#glow)">Automa&#231;&#227;o de Processos (RPA)</text>
  <rect class="caret" y="15" width="2.5" height="26" rx="1" filter="url(#glow)">
    <animate attributeName="x" values="114;114;494.8;494.8;114;114" keyTimes="0;0.5;0.5889;0.6667;0.7222;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;0.5;0.7222;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- Frase 4 -->
  <text class="line" x="110" y="38" clip-path="url(#clip3)" filter="url(#glow)">Clean Code | SOLID | CI/CD</text>
  <rect class="caret" y="15" width="2.5" height="26" rx="1" filter="url(#glow)">
    <animate attributeName="x" values="114;114;467.6;467.6;114;114" keyTimes="0;0.75;0.8389;0.9167;0.9722;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;0.75;0.9722;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
  </rect>
</svg>
